<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">My To-Do List</a>
        </div>
    </nav>

    
    <div class="container my-5">

        <div class="todo-container">

            <h2 class="text-center">Task Manager</h2>

            <p class="text-center text-muted">
                Organize your tasks and stay productive.
            </p>

            
            <div class="input-group mb-3">

                <input
                    type="text"
                    id="taskInput"
                    class="form-control"
                    placeholder="Enter a new task...">

                <button
                    id="addTaskBtn"
                    class="btn btn-primary">
                    Add Task
                </button>

            </div>

            
            <p id="errorMessage" class="text-danger"></p>

            
            <div class="d-flex justify-content-between mb-2">
                <span>Your tasks</span>
                <span id="taskCounter" class="badge bg-primary">
                    0 remaining
                </span>
            </div>

            
            <div class="btn-group w-100 mb-3">

                <button class="btn btn-primary filter-btn"
                    data-filter="all">
                    All
                </button>

                <button class="btn btn-outline-primary filter-btn"
                    data-filter="active">
                    Active
                </button>

                <button class="btn btn-outline-primary filter-btn"
                    data-filter="completed">
                    Completed
                </button>

            </div>

            
            <ul id="taskList" class="list-group mb-3">
            </ul>

            <!-- Clear Completed Button -->
            <div class="text-end">

                <button id="clearCompletedBtn"
                    class="btn btn-outline-danger btn-sm">
                    Clear Completed
                </button>

            </div>

        </div>

    </div>

    
    <script src="script.js"></script>

</body>

</html>
